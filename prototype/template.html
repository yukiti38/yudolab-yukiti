<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NKC / WHC 競馬ゲーム試作</title>
<style>
  :root { --bg:#10160f; --panel:#1b241a; --panel2:#232f22; --line:#3a4a38; --txt:#e8f0e4; --sub:#a9bfa2; --acc:#7fe07a; --warn:#ffcf6e; --bad:#ff8f8f; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Hiragino Sans","Noto Sans JP",sans-serif; background:var(--bg); color:var(--txt); }
  header { background:#0b100a; border-bottom:1px solid var(--line); padding:10px 16px; display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; }
  header .date { font-size:20px; font-weight:700; }
  header .funds { color:var(--warn); font-weight:700; }
  button { background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer; font-size:14px; }
  button:hover { border-color:var(--acc); }
  button.primary { background:#2c5b2a; border-color:var(--acc); font-weight:700; }
  button:disabled { opacity:.38; cursor:not-allowed; }
  main { max-width:1180px; margin:0 auto; padding:14px; display:grid; grid-template-columns:1fr; gap:14px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .panel h2 { margin:2px 0 10px; font-size:16px; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; }
  .tabs button.active { background:#2c5b2a; border-color:var(--acc); }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th, td { border-bottom:1px solid var(--line); padding:5px 6px; text-align:left; vertical-align:top; }
  th { color:var(--sub); font-weight:600; }
  .entryscroll { max-height:52vh; overflow-y:auto; border:1px solid var(--line); border-radius:8px; margin-top:6px; -webkit-overflow-scrolling:touch; }
  .entryscroll th { position:sticky; top:0; background:var(--panel); z-index:1; }
  .ped td { background:var(--panel2); }
  .ped td.sireline { background:#22382a; }
  .ped td.damline { background:#382631; }
  .sub { color:var(--sub); font-size:12.5px; }
  .topic { border-left:3px solid var(--acc); padding:4px 8px; margin:6px 0; background:var(--panel2); border-radius:0 8px 8px 0; }
  .chron { font-size:13.5px; line-height:1.75; }
  .chron .when { color:var(--sub); margin-right:8px; }
  .ok { color:var(--acc); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  select, input[type=text] { background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:6px 8px; font-size:14px; }
  .flex { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .horse-link { color:var(--acc); cursor:pointer; text-decoration:underline; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.66); display:none; z-index:20; }
  .modal .box { background:var(--panel); border:1px solid var(--line); border-radius:12px; max-width:760px; margin:5vh auto; padding:18px; max-height:88vh; overflow:auto; }
  .kv { display:grid; grid-template-columns:110px 1fr; gap:4px 10px; font-size:14px; }
  .kv dt { color:var(--sub); } .kv dd { margin:0; }
</style>
</head>
<body>
<header>
  <div class="date" id="dateLabel"></div>
  <div class="funds" id="fundsLabel"></div>
  <div class="flex">
    <button class="primary" id="nextWeekBtn">週を進める ▶</button>
    <button id="nextEventBtn">次のイベントまで ⏩</button>
    <button class="ghost" id="debugHorseBtn">🐛 デバッグ馬を作成</button>
    <button id="resetBtn">最初から</button>
    <button class="ghost" id="exportBtn">💾 書き出し</button>
    <button class="ghost" id="importBtn">📥 読み込み</button>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none;">
  </div>
  <div class="flex">
    <span class="sub">指定週まで：</span>
    <button class="ghost" id="skipYearMinus">−1年</button>
    <input type="text" id="skipYear" size="5" value="2027">
    <button class="ghost" id="skipYearPlus">+1年</button>
    <span class="sub">年</span>
    <select id="skipMonth"></select>
    <span class="sub">月 第</span>
    <select id="skipWeek"><option>1</option><option>2</option><option>3</option><option>4</option></select>
    <span class="sub">週まで</span>
    <button id="skipBtn">スキップ ⏭</button>
  </div>
  <div class="flex">
    <span class="sub">かんたんスキップ：</span>
    <button class="ghost" data-rel-months="1">+1ヶ月</button>
    <button class="ghost" data-rel-months="3">+3ヶ月</button>
    <button class="ghost" data-rel-months="6">+6ヶ月</button>
    <button class="ghost" data-rel-months="12">+1年</button>
    <button class="ghost" data-rel-months="36">+3年</button>
    <button class="ghost" data-rel-months="60">+5年</button>
    <span class="sub">｜</span>
    <button class="ghost" data-milestone="foal">次の出産シーズン（1月）</button>
    <button class="ghost" data-milestone="breed">次の繁殖シーズン（2月）</button>
    <button class="ghost" data-milestone="yearend">年末（12月第4週）</button>
  </div>
  <div class="sub">試作 v0.23 ／ 目標なし・週刻み・過程を見つめるゲーム。開始時に繁殖牝馬を1頭選ぶところから始まります。初年度は4月に2歳馬、12月に1歳馬の贈呈があります（辞退も可）。能力は設計用の仮数値、海外レースの1着賞金は2025年の実額（racedb調べ・固定レート換算）です。スキップは「かんたんスキップ」のボタンでも進められます。「🐛 デバッグ馬を作成」ではステータスを指定して馬を作れます（動作確認用）。</div>
</header>
<main>
  <section class="panel" id="topicPanel"><h2>今週のトピック</h2><div id="topics"></div></section>
  <section class="panel">
    <div class="tabs" id="tabs">
      <button data-tab="horses" class="active">所有馬</button>
      <button data-tab="entry">出走登録</button>
      <button data-tab="breed">繁殖（2〜6月）</button>
      <button data-tab="stallions">種牡馬</button>
      <button data-tab="chron">牧場年表</button>
    </div>
    <div id="tabBody" style="margin-top:12px;"></div>
  </section>
</main>
<div class="modal" id="horseModal"><div class="box" id="horseModalBox"></div></div>
<script>
"use strict";
/*__DATA__*/
/* ================= ユーティリティ ================= */
const $ = s => document.querySelector(s);
const rnd = (a,b) => a + Math.random()*(b-a);
const irnd = (a,b) => Math.floor(rnd(a,b+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const man = yen => yen >= 10000 ? (Math.round(yen/100)/100).toLocaleString()+"億円" : Math.round(yen).toLocaleString()+"万円";
const GRADE_ORDER = ["GI","GII","GIII","JpnI","JpnII","JpnIII","L","OP","3勝クラス","2勝クラス","1勝クラス","未勝利","新馬"];
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31 + s.charCodeAt(i))>>>0; return h; }
/* ================= カレンダー ================= */
// 1年 = 12ヶ月 × 4週 = 48週。「何月・第何週」表示。
function weekKey(y,m,w){ return y*10000 + m*100 + w; }
function racesThisWeek(y,m,w){
  const out = [];
  for(const r of DATA.domestic) if(r.month===m && r.wom===w) out.push(r);
  for(const r of DATA.overseas) if(r.month===m && r.wom===w) out.push(r);
  out.push(...generalRaces(y,m,w));
  return out;
}
// 一般競走（新馬・未勝利・条件）は開催フォーマットから自動生成（仕様書の解釈どおり）
const COURSES = ["東京","中山","京都","阪神","中京","新潟","小倉","福島","函館","札幌"];
function generalRaces(y,m,w){
  const out = [];
  const ci = (m*4 + w + y) % COURSES.length;
  const c1 = COURSES[ci], c2 = COURSES[(ci+3) % COURSES.length];
  const mk = (name, course, surface, dist, cond, cls) => ({name, grade:cls, sector:"central", category:"general", racecourse:course, surface, distance_m:dist, conditions:cond, month:m, wom:w, general:true});
  if(m>=6) out.push(mk("2歳新馬", c1, "芝", 1600, "2歳", "新馬"));
  if(m>=6) out.push(mk("2歳新馬", c2, "ダート", 1200, "2歳", "新馬"));
  if(m>=6) out.push(mk("2歳未勝利", c2, "芝", 1400, "2歳", "未勝利"));
  if(m>=6) out.push(mk("2歳未勝利", c1, "ダート", 1400, "2歳", "未勝利"));
  if(m<=9) out.push(mk("3歳未勝利", c1, "芝", 1800, "3歳", "未勝利"));
  if(m<=9) out.push(mk("3歳未勝利", c2, "ダート", 1400, "3歳", "未勝利"));
  out.push(mk("1勝クラス", c1, "芝", 2000, "3歳以上", "1勝クラス"));
  out.push(mk("1勝クラス", c2, "ダート", 1700, "3歳以上", "1勝クラス"));
  out.push(mk("2勝クラス", c1, "芝", 1600, "3歳以上", "2勝クラス"));
  out.push(mk("3勝クラス", c2, "芝", 2200, "3歳以上", "3勝クラス"));
  out.push(mk("3勝クラス", c1, "ダート", 1800, "3歳以上", "3勝クラス"));
  return out;
}
/* 賞金（1着〜5着、万円）＝グレード別の設計値 */
/* 海外の賞金水準（国内同格比）。実際の各国の賞金規模感をもとにした設計値 */
const COUNTRY_PRIZE = {"サウジアラビア":2.5, "アメリカ":2.2, "アラブ首長国連邦":2.0, "香港":1.8, "オーストラリア":1.5, "イギリス":1.4, "フランス":1.3, "アイルランド":1.2, "カナダ":1.2, "ドイツ":1.0, "イタリア":0.9, "ニュージーランド":0.8};
function prizeTable(race){
  /* 海外レースは racedb 2025 の実１着賞金（円換算・万円）があればそれを使う */
  if(race.prize_first){
    const f = race.prize_first;
    return [f, Math.round(f*0.4), Math.round(f*0.25), Math.round(f*0.15), Math.round(f*0.1)];
  }
  const g = race.grade;
  const seed = 0.85 + (hashStr(race.name||"") % 40)/100;
  let base;
  if(g==="GI"||g==="JpnI") base = 20000; else if(g==="GII"||g==="JpnII") base = 10000;
  else if(g==="GIII"||g==="JpnIII") base = 6000; else if(g==="L") base = 2600;
  else if(g==="OP") base = 2200; else if(g==="3勝クラス") base = 1800;
  else if(g==="2勝クラス") base = 1100; else if(g==="1勝クラス") base = 800;
  else base = 550;
  if(race.sector==="overseas") base *= (COUNTRY_PRIZE[race.country] || 1.6);
  const first = Math.round(base*seed);
  return [first, Math.round(first*0.4), Math.round(first*0.25), Math.round(first*0.15), Math.round(first*0.1)];
}
function rivalStrength(race){
  const g = race.grade;
  if(g==="GI"||g==="JpnI") return race.sector==="overseas" ? [84,97] : [82,96];
  if(g==="GII"||g==="JpnII") return [78,92];
  if(g==="GIII"||g==="JpnIII") return [74,89];
  if(g==="L"||g==="OP") return [72,86];
  if(g==="3勝クラス") return [68,82];
  if(g==="2勝クラス") return [62,76];
  if(g==="1勝クラス") return [56,70];
  if(race.grade==="新馬") return [48,66];
  return [44,62]; // 未勝利
}
function fieldSize(race){
  const g = race.grade;
  if(g==="GI"||g==="JpnI") return irnd(14,18);
  if(g && g.startsWith("G")) return irnd(12,17);
  if(g==="L"||g==="OP") return irnd(11,16);
  return irnd(10,16);
}
</script>
<script>
"use strict";
/* ================= 状態 ================= */
const SAVE_KEY = "nkc_whc_keiba_proto_v6";
let S = null;
const FOAL_A = ["ハル","ユキ","ソラ","カゼ","ホシ","ツキ","ウミ","リク","ヒカリ","サクラ","モモ","アンズ","フジ","タケ","マツ","ウメ"];
const FOAL_B = ["ノカゼ","ノヒカリ","ノソラ","ダンサー","ランナー","クイーン","キング","ハート","ドリーム","スター","ウィング","リバー","マウンテン","フィールド","ブライト","グローリー"];
function foalName(){ return pick(FOAL_A)+pick(FOAL_B); }
function stallionPower(st){ return st.fee_tier==="S"?92 : st.fee_tier==="A"?86 : st.fee_tier==="B"?80 : 74; }
function newHorse(o){
  return Object.assign({ id: Math.random().toString(36).slice(2,10), wins:0, earnings:0, results:[], fatigue:0,
    condition:80, policy:"train", pregnant:null, enteredRaceKey:null, enteredAbs:null, lastRaceAbs:-9, retired:false }, o);
}
function absWeek(){ return (S.year-2026)*48 + (S.month-1)*4 + (S.week-1); }
function ageOf(h){ return S.year - h.birthYear; }
function maturityA(h, a){
  if(h.superMax) return 1;
  if(h.growth==="超晩成"){
    const growV = clamp(1 - Math.abs(a-8.4)*0.07, 0.45, 1);
    const youngV = a < 2.5 ? clamp(0.30 + (a-1.5)*0.30, 0.3, 0.95) : growV;
    const oldV = a > 10 ? clamp(1 - (a-10)*0.05, 0.7, 1) : 1;
    return youngV*oldV;
  }
  const peak = h.growth==="早熟"?3.6 : h.growth==="晩成"?5.4 : 4.6;
  const grow = clamp(1 - Math.abs(a-peak)*0.10, 0.55, 1);
  const young = a < 2.5 ? clamp(0.45 + (a-1.5)*0.45, 0.4, 0.95) : grow;
  const old = a > 8 ? clamp(1 - (a-8)*0.08, 0.6, 1) : 1;
  return young*old;
}
function maturity(h){ return maturityA(h, ageOf(h) + (S.month-1)/12); }
/* ===== 3パラメータ（スピード／スタミナ／根性、隠し値40〜100・表示はS〜Gランクのみ） ===== */
function rankOf(v){ return v>=96?"S":v>=89?"A":v>=82?"B":v>=75?"C":v>=68?"D":v>=61?"E":v>=54?"F":"G"; }
function triSpread(n){ return Math.round((irnd(-n,n)+irnd(-n,n))/2); }
function clampParam(v){ return clamp(Math.round(v), 40, 100); }
function setParams(h, spd, sta, gut){ h.spd = clampParam(spd); h.sta = clampParam(sta); h.gut = clampParam(gut); h.ability = Math.round((h.spd+h.sta+h.gut)/3); }
function paramsFromAbility(h){
  if(h.superMax){ h.spd = 115; h.sta = 115; h.gut = 115; h.ability = 115; return; }
  const a = h.ability || 70;
  setParams(h, a + irnd(-6,6), a + irnd(-6,6), a + irnd(-6,6));
}
function ensureParams(){
  if(!S) return;
  for(const h of S.horses){
    if(h.spd == null) paramsFromAbility(h);
    if(!h.coat) h.coat = randomCoat();
    if(h.temp == null){ h.temp = newTemp(); h.quirk = rollQuirk(h.temp); }
    if(!h.rankBase) h.rankBase = { spd: effRank(h,"spd"), sta: effRank(h,"sta"), gut: effRank(h,"gut") };
  }
  for(const st of S.stallions){ stallionGen(st); if(!st.coat) st.coat = randomCoat(); }
}
const TIER_BASE = { S:90, A:84, B:78, C:72 };
/* 種牡馬の遺伝値：格が中心、距離適性の中心でスピード/スタミナに傾向。自家製は本人のパラメータそのもの */
function stallionGen(st){
  const mine = S.horses.find(h=>h.status==="stallion" && h.name===st.name);
  if(mine && mine.spd != null) return { spd:mine.spd, sta:mine.sta, gut:mine.gut, temp:(mine.temp != null ? mine.temp : 55) };
  if(st.genSpd == null){
    const base = TIER_BASE[st.fee_tier] || 76;
    const mid = (st.dist[0]+st.dist[1])/2;
    const bias = clamp(Math.round((2000-mid)/200), -4, 4);
    st.genSpd = clampParam(base + bias + irnd(-4,4));
    st.genSta = clampParam(base - bias + irnd(-4,4));
    st.genGut = clampParam(base + irnd(-4,4));
  }
  if(st.genTemp == null) st.genTemp = clamp(lineTempBase(st.sire) + irnd(-12, 12), 25, 90);
  return { spd:st.genSpd, sta:st.genSta, gut:st.genGut, temp:st.genTemp };
}
/* 父系ごとの気性の中心（血統準拠：系統で気性の荒さが決まり、個体差が乗る） */
function lineTempBase(sireName){
  if(!sireName) return 52;
  let hsum = 0; for(const ch of String(sireName)) hsum = (hsum*31 + ch.charCodeAt(0)) % 997;
  return 38 + (hsum % 35);
}
/* ===== 気性と癖（気性：隠し値、表示は 穏やか／普通／気性難。癖が脚質適性を曲げる） ===== */
function tempBand(v){ return v == null ? "普通" : v >= 70 ? "気性難" : v >= 45 ? "普通" : "穏やか"; }
const QUIRK_LABEL = { pack:"馬群を嫌う", keen:"前に行きたがる" };
const QUIRK_NOTE = { pack:"馬群を嫌うので、後方で脚を溜める形や逃げが合う", keen:"前に行きたがるので、後ろで抑える脚質は合わない" };
/* 癖はラベルでは明かさず、スタッフの観察コメントとして匂わせる（脚質適性も非表示。判断はステータスと観察から） */
const QUIRK_HINT = { pack:"調教では馬群の中を嫌がる素振りを見せる", keen:"調教では前に行きたがる素振りを見せる" };
function quirkProb(temp){ return temp >= 70 ? 0.30 : temp >= 45 ? 0.10 : 0.03; }
function rollQuirk(temp, mul){
  const p = Math.min(0.65, quirkProb(temp) * (mul || 1));
  if(Math.random() >= p) return null;
  return Math.random() < 0.5 ? "pack" : "keen";
}
/* 確変：種牡馬・繁殖牝馬ともに気性が荒い配合は、産駒の癖の確率が跳ね上がる */
function isHotCross(sireTemp, damTemp){ return sireTemp >= 70 && damTemp >= 65; }
function newTemp(){ return irnd(35, 80); }
function tempSpreadMul(h){
  const b = tempBand(h.temp);
  return b === "気性難" ? 1.25 : b === "穏やか" ? 0.85 : 1;
}
/* パラメータ別の成熟：スピードは前倒し、スタミナ・根性は後倒し（年齢シフト） */
function paramNow(h, kind){
  const shift = kind==="spd" ? 0.6 : kind==="sta" ? -0.5 : -0.6;
  return (h[kind] != null ? h[kind] : 70) * maturityA(h, ageOf(h) + (S.month-1)/12 + shift);
}
/* スピード比重：設計書のアンカー点（1400以下.7／1600 .6／2000 .5／2400 .4／3000以上.3）を線形補間 */
const SPEED_ANCHORS = [[0,0.7],[1400,0.7],[1600,0.6],[2000,0.5],[2400,0.4],[3000,0.3],[99999,0.3]];
function speedWeight(dist){
  if(!dist) return 0.5;
  for(let i=1;i<SPEED_ANCHORS.length;i++){
    if(dist <= SPEED_ANCHORS[i][0]){
      const [d0,w0] = SPEED_ANCHORS[i-1], [d1,w1] = SPEED_ANCHORS[i];
      return w0 + (w1-w0) * (dist-d0)/(d1-d0);
    }
  }
  return 0.3;
}
function raceBase(h, race){
  const w = speedWeight(race.distance_m);
  const blend = paramNow(h,"spd")*w + paramNow(h,"sta")*(1-w);
  return blend * (0.82 + h.condition/500) * (1 - h.fatigue/260);
}
function effAbility(h){ return h.ability * maturity(h) * (0.82 + h.condition/500) * (1 - h.fatigue/260); }
/* ===== 脚質（適性はパラメータ依存：スタミナ→逃げ・先行、スピード→差し・追込、根性は全てにプラス） ===== */
const STYLES = ["逃げ","先行","差し","追込"];
function styleApt(h){
  const adj = ((h.gut != null ? h.gut : 70) - 70) * 0.2;
  const spd = h.spd != null ? h.spd : 70, sta = h.sta != null ? h.sta : 70;
  const apt = { "逃げ": sta + adj, "先行": sta*0.85 + spd*0.15 + adj, "差し": spd*0.85 + sta*0.15 + adj, "追込": spd + adj };
  /* バランスの取れた馬は中間脚質（先行・差し）が最適になり得るよう、均衡ボーナスを加える */
  const bal = Math.max(0, 4 - Math.abs(spd-sta) * 0.12);
  apt["先行"] += bal; apt["差し"] += bal;
  /* 癖が適性そのものを曲げる（表示される◎○△×は癖込みの実効適性） */
  if(h.quirk === "pack"){ apt["差し"] -= 12; apt["先行"] -= 8; apt["追込"] += 10; apt["逃げ"] += 5; }
  else if(h.quirk === "keen"){ apt["逃げ"] += 10; apt["先行"] += 8; apt["差し"] -= 10; apt["追込"] -= 12; }
  return apt;
}

function runRace(race, entries){

  for(const h of entries){
    const gut = paramNow(h,"gut");
    const spread = 0.10 * (1 - clamp((gut-40)/60, 0, 1) * 0.5) * (STYLE_VAR[styleOf(h)] || 1) * tempSpreadMul(h);
    runners.push({ horse:h, score: raceBase(h,race)*aptitudeFactor(h,race)*styleFactor(h,pace)*(1 + rnd(-1,1)*spread), gut });
  }
  const nRivals = fs - entries.length;
  for(let i=0;i<nRivals;i++) runners.push({ horse:null, score: rnd(rlo,rhi)*rnd(0.88,1.1) });
  runners.sort((a,b)=>b.score-a.score);
  /* 根性の競り合い補正：僅差で負けている自家馬は、根性の高さ次第で競り勝つことがある */
  for(let i=1;i<runners.length;i++){
    const up = runners[i-1], dn = runners[i];
    if(!dn.horse) continue;
    const gap = up.score - dn.score;
    if(gap >= 0 && gap < 1.2 && Math.random() < Math.max(0, (dn.gut||70) - 70) * 0.01){
      runners[i-1] = dn; runners[i] = up;
    }
  }
  const prizes = prizeTable(race);
  const baseTime = race.distance_m ? race.distance_m/16.8 : 100;
  const resultsOut = [];
  runners.forEach((r, idx) => {
    if(!r.horse) return;
    const h = r.horse;
    const finish = idx+1;
    const prize = finish<=5 ? prizes[finish-1] : 0;
    const rec = { when: S.year+"年"+S.month+"月第"+S.week+"週", race: race.name, grade: race.grade||"", course: race.racecourse||"",
      surface: race.surface||"", dist: race.distance_m||null, finish, field: fs, pace, style: styleOf(h),
      pass: passPositions(styleOf(h), finish, fs, h.quirk), comment: raceComment(styleOf(h), pace, finish, h.quirk),
      time: race.distance_m ? (baseTime + idx*0.35 + rnd(0,0.5)).toFixed(1) : "", agari: (rnd(33.2,36.8)).toFixed(1), prize };
    h.results.push(rec); h.earnings += prize; S.funds += prize;
    if(finish===1){ h.wins++; if(["GI","GII","GIII","JpnI","JpnII","JpnIII","L"].includes(race.grade)) h.gradedWin = true; }
    h.fatigue = clamp(h.fatigue + irnd(34,52), 0, 100);
    h.condition = clamp(h.condition - irnd(6,16), 5, 100);
    h.lastRaceAbs = absWeek(); h.enteredRaceKey = null; h.enteredAbs = null; h.enteredStyle = null;
    resultsOut.push({h, finish, prize});
    chron("【レース】"+race.name+"（"+(race.grade||"")+"・"+(race.racecourse||"")+"） "+h.name+" "+finish+"着／"+fs+"頭"+(prize?"、賞金"+man(prize):"")+"（"+pace+"・"+rec.style+"）");
    if(finish===1) topic("🏆 "+h.name+" が "+race.name+" を勝ちました");
  });
  return resultsOut;
}

      const surf = st.surface===h.surface ? (Math.random()<0.9 ? st.surface : "両刀")
        : (Math.random()<0.45 ? st.surface : Math.random()<0.82 ? h.surface : "両刀");
      const bmsSt = S.stallions.find(s=>s.name===h.sire);
      const cS = (st.dist[0]+st.dist[1])/2, cD = (h.distMin+h.distMax)/2, cB = bmsSt ? (bmsSt.dist[0]+bmsSt.dist[1])/2 : cD;
      const centre = cS*0.5 + cD*0.35 + cB*0.15 + irnd(-200,200);
      const width = Math.max(500, ((st.dist[1]-st.dist[0]) + (h.distMax-h.distMin))/2);
      const r50 = v => clamp(Math.round(v/50)*50, 1000, 4000);
      const sireCoat = (S.horses.find(x=>x.status==="stallion" && x.name===st.name) || {}).coat || st.coat;
      const foal = newHorse({ name: foalName(), sex, birthYear:S.year, sire:st.name, dam:h.name, bms:h.sire,
        status:"foal", surface: surf, coat: inheritCoat(sireCoat, h.coat),
        distMin: r50(centre - width/2), distMax: r50(centre + width/2),
        growth: inheritGrowth(st.growth, h.growth), ability: 70 });
      setParams(foal, fp(sg.spd, h.spd), fp(sg.sta, h.sta), fp(sg.gut, h.gut));
      /* 気性の継承：父母平均＋母父の薄い引き＋ブレ。両親とも荒いと「確変」で癖の確率が跳ね上がる */
      const bmsTemp = bmsSt ? stallionGen(bmsSt).temp : 55;
      foal.temp = clamp(Math.round((sg.temp + (h.temp != null ? h.temp : 55))/2 + (bmsTemp - 55) * 0.15 + triSpread(10)), 25, 98);
      foal.quirk = rollQuirk(foal.temp, isHotCross(sg.temp, h.temp) ? 2.2 : 1);
      S.horses.push(foal);
      chron("【誕生】"+h.name+" が "+st.name+" の"+sex+"馬を出産。名前は「"+foal.name+"」");
      topic("🐴 "+foal.name+"（父"+st.name+"）が誕生しました");
      h.pregnant = null;
    }
  }
  // 成長段階の更新
  for(const h of S.horses){
    if(h.status==="foal" && ageOf(h)>=1) h.status="yearling";
    else if(h.status==="yearling" && ageOf(h)>=2){ h.status="racehorse"; chron(h.name+" は2歳になり、現役馬に編入された"); }
  }
  // 種牡馬の世代交代（小さく入れ替える）
  stallionTurnover();
  // 年末表彰っぽい年表
  const best = S.horses.filter(h=>h.status==="racehorse").sort((a,b)=>b.earnings-a.earnings)[0];
  if(best && best.earnings>0) chron("【NKC年度記録】ここまでの獲得賞金トップは "+best.name+"（"+man(best.earnings)+"）");
}
function stallionTurnover(){
  // 引退ルール（ユーザー決定）：種牡馬生活20年、もしくは27〜29歳（個体ごとに設定）に達したら引退
  for(const st of S.stallions){
    st.age = (st.age||12)+1;
    if(st.sinceYear == null) st.sinceYear = S.year - Math.max(1, st.age - 6);
    if(st.retireAge == null) st.retireAge = irnd(27, 29);
  }
  const out = [];
  S.stallions = S.stallions.filter(st => {
    const tenure = S.year - st.sinceYear;
    const retire = tenure >= 20 || st.age >= st.retireAge;
    if(retire) out.push({ name: st.name, why: tenure >= 20 ? "種牡馬生活20年" : st.age+"歳" });
    return !retire;
  });
  for(const o of out) chron("【種牡馬】"+o.name+" が種牡馬を引退した（"+o.why+"）");
  const candidates = [["フォーエバーヤング","リアルスティール"],["シティオブトロイ","Justify"],["ロマンチックウォーリア","Acclamation"],["ドウデュース","ハーツクライ"],["タスティエーラ","サトノクラウン"],["ソールオリエンス","キタサンブラック"],["ベラジオオペラ","ロードカナロア"],["シンエンペラー","Siyouni"]];
  let guard = 0;
  while(S.stallions.length<50 && guard++<60){
    const cand = guard<=40 ? pick(candidates) : null;
    const c = cand ? cand[0] : foalName();
    if(S.stallions.some(s=>s.name===c)) continue;
    const surf = Math.random()<0.75 ? "芝" : "ダート";
    const lo = pick([1200,1400,1600,1800,2000]), hi = lo + pick([400,600,800]);
    S.stallions.push({ name:c, sire: cand ? cand[1] : (S.stallions.length ? pick(S.stallions).name : "―"), region: Math.random()<0.7?"domestic":"overseas", surface:surf, dist:[lo,hi], growth:pick(["早熟","普通","晩成"]), fee_tier:pick(["A","B","B","C"]), age:irnd(6,9), sinceYear:S.year, retireAge:irnd(27,29), fresh:true });
    chron("【種牡馬】"+c+" が新たに種牡馬入りした");
  }
}
function weeklyEvents(){
  if(S.month===2 && S.week===1) topic("🌸 繁殖シーズンが始まりました（2〜6月）。「繁殖」タブで種付けできます");

  if(S.month===11 && S.week===1 && S.salePool && S.salePool.length) topic("🐴 繁殖牝馬セールが始まりました（11〜12月、「繁殖」タブ）。最初に選ばなかった候補も出ています");
  if(S.year===2026 && S.month===4 && S.week===1 && !S.giftAprDone){ S.giftAprDone = true; S.giftQueue.push(makeGift("2yo")); topic("🎁 初年度の支援で2歳馬が贈られます。名前を付けて迎えるか、辞退もできます"); }
  if(S.year===2026 && S.month===12 && S.week===1 && !S.giftDecDone){ S.giftDecDone = true; S.giftQueue.push(makeGift("1yo")); topic("🎁 初年度の支援で1歳馬が贈られます。名前を付けて迎えるか、辞退もできます"); }
  for(const h of S.horses){
    if(h.status==="racehorse" && ageOf(h)>=7 && !h.retireNudged){ h.retireNudged = true; topic("引退を考え始める時期です："+h.name+"（"+ageOf(h)+"歳）。馬のページから引退させられます"); }
    if(h.status==="racehorse" && h.fatigue>=80) topic("⚠️ "+h.name+" の疲労がかなり溜まっています。放牧か休養がおすすめです");
    if(h.status==="racehorse" && growthStage(h)==="充実期" && !h.peakNoted){ h.peakNoted = true; topic("🌟 "+h.name+" が充実期に入りました（"+h.growth+"）"); }
  }
  // 成長イベント：毎月第3週、若い馬の様子が年表に残る
  if(S.week===3){
    const young = S.horses.filter(h => !h.retired && (h.status==="foal" || h.status==="yearling" || (h.status==="racehorse" && ageOf(h)<=3)));
    if(young.length && Math.random()<0.75){
      const h = pick(young);
      chron("【成長】"+h.name+"："+pick(GROWTH_NOTES)+"（"+growthStage(h)+"）");
    }
  }
}
function nextEvent(){
  // イベント（トピック発生 or 登録済みレース or 出産年替わり）が来る週まで進める（最大60週）
  S.silent = true;
  for(let i=0;i<60;i++){
    const beforeY = S.year;
    advanceWeek();
    if(S.topics.length || S.year!==beforeY) break;
    if(S.horses.some(h=>h.enteredRaceKey)) break;

}
function skipTo(y, m, w){
  // 指定した年・月・週まで進める（最大50年分）。途中の出来事は年表に残る。
  const target = (y-2026)*48 + (m-1)*4 + (w-1);
  let guard = 0;
  S.silent = true;
  while(absWeek() < target && guard++ < 2400) advanceWeek();
  S.silent = false;
  if(absWeek() >= target) chron("【スキップ】"+y+"年"+m+"月第"+w+"週まで進めた");
  else chron("【スキップ】上限のため "+S.year+"年"+S.month+"月第"+S.week+"週 で停止した");
  save(); render();
}

  const rk = GRADE_RANK[r.grade];
  if(rk===0) return "g1"; if(rk===1) return "g2"; if(rk===2) return "g3";
  return "listed";
}
function raceMatchesFilters(r){
  if(entryFilter.sector!=="all" && r.sector!==entryFilter.sector) return false;
  if(entryFilter.grade!=="all" && gradeGroup(r)!==entryFilter.grade) return false;
  if(entryFilter.surface!=="all" && r.surface!==entryFilter.surface) return false;
  if(entryFilter.dist!=="all"){
    const d = r.distance_m; if(d==null) return false;
    if(entryFilter.dist==="sprint" && d>1400) return false;
    if(entryFilter.dist==="mile" && (d<1500 || d>1800)) return false;
    if(entryFilter.dist==="middle" && (d<1900 || d>2200)) return false;
    if(entryFilter.dist==="long" && d<2300) return false;
  }
  return true;
}

const GRADE_RANK = {"GI":0,"G1":0,"JpnI":0,"GII":1,"G2":1,"JpnII":1,"J-GI":1,"GIII":2,"G3":2,"JpnIII":2,"J-GII":2,"L":3,"J-GIII":3,"オープン":4};
function sortedRacesFor(h, wk){
  const mid = (h.distMin + h.distMax) / 2;
  const arr = wk.map(r => ({ r, reason: eligibility(h, r), apt: aptitudeFactor(h, r) }));
  const gr = x => (GRADE_RANK[x.r.grade] != null ? GRADE_RANK[x.r.grade] : (x.r.general ? 6 : 5));
  const dist = x => (x.r.distance_m == null ? 99999 : x.r.distance_m);
  if(entrySort==="recommend") arr.sort((a,b)=> ((a.reason?1:0)-(b.reason?1:0)) || (b.apt-a.apt) || (gr(a)-gr(b)));
  else if(entrySort==="near") arr.sort((a,b)=> (Math.abs(dist(a)-mid)-Math.abs(dist(b)-mid)) || (gr(a)-gr(b)));
  else if(entrySort==="distAsc") arr.sort((a,b)=> dist(a)-dist(b));
  else if(entrySort==="distDesc") arr.sort((a,b)=> (dist(b)===99999?-1:dist(b)) - (dist(a)===99999?-1:dist(a)));
  else if(entrySort==="grade") arr.sort((a,b)=> (gr(a)-gr(b)) || (prizeTable(b.r)[0]-prizeTable(a.r)[0]));
  else if(entrySort==="course") arr.sort((a,b)=> String(a.r.racecourse||"").localeCompare(String(b.r.racecourse||""), "ja") || (gr(a)-gr(b)));
  else if(entrySort==="prize") arr.sort((a,b)=> prizeTable(b.r)[0]-prizeTable(a.r)[0]);
  return arr;
}
function drawEntryList(){

  }).join("");
  box.innerHTML = "<div class='sub'>絞込み後 "+arr.length+" 件（うち出走可能 "+okCount+" 件）／"+tm+"月第"+tw+"週の全 "+wk.length+" レース</div>"
    + "<div class='entryscroll'><table><tr><th></th><th>レース</th><th>区分</th><th>賞金</th><th></th></tr>"+rows+"</table></div>";

let mateMareId = null, mateSort = "recommend";

/* 自家製種牡馬か（自牧場の馬が種牡馬入りしたもの。ロスターの自動補充組は含まない） */
function isHomebredStallion(st){ return S.horses.some(h=>h.status==="stallion" && h.name===st.name); }
function compatScore(m, st){
  let s = 0;
  if(st.surface===m.surface) s += 2; else if(st.surface==="芝ダート" || m.surface==="芝ダート") s += 1;
  const overlap = Math.min(m.distMax, st.dist[1]) - Math.max(m.distMin, st.dist[0]);
  if(overlap>=400) s += 2; else if(overlap>=0) s += 1;
  return s;
}
function compatMark(m, st){ const s = compatScore(m, st); return s>=4 ? "◎" : s>=2 ? "○" : s>=1 ? "△" : "×"; }
function inbreedNote(m, st){
  if(st.name===m.sire) return "父と同一（インブリード）";
  if(st.name===m.bms) return "母父と同一";
  if(st.sire && st.sire===m.sire) return "父系が近い";
  return "";
}
function mateWith(m, st){
  const f = FEE_VAL[st.fee_tier];
  if(S.funds < f){ topic("⚠️ 資金が足りません"); save(); render(); return; }
  S.funds -= f;
  m.lastSire = st.name;
  const guaranteed = !S.firstMatingDone; // 最初の1回だけ受胎確定（滑り出しで詰まらないための配慮）
  if(guaranteed || Math.random() < 0.85){ S.firstMatingDone = true; m.pregnant = { sire: st.name, dueYear: S.year+1 }; chron("【種付け】"+m.name+" × "+st.name+"（種付料"+f+"万円）"); topic("🌸 "+m.name+" が "+st.name+" を受胎しました（来年出産予定）"); }
  else { chron("【種付け】"+m.name+" × "+st.name+" は不受胎だった"); topic(m.name+" は不受胎でした。また来年。"); }
  save(); render();
}
function sortedForMating(m){
  const arr = S.stallions.filter(st =>
    (mateFilter.region==="all" || st.region===mateFilter.region) &&
    (mateFilter.surface==="all" || st.surface===mateFilter.surface) &&
    (mateFilter.feeMax==="all" || FEE_VAL[st.fee_tier] <= parseInt(mateFilter.feeMax,10)) &&
    (!mateFilter.homeOnly || isHomebredStallion(st)));
  const growOrd = {"早熟":0, "普通":1, "晩成":2};
  if(mateSort==="recommend") arr.sort((a,b)=> (compatScore(m,b)-compatScore(m,a)) || (((S.favs||[]).includes(b.name)?1:0)-((S.favs||[]).includes(a.name)?1:0)) || (FEE_VAL[b.fee_tier]-FEE_VAL[a.fee_tier]));
  else if(mateSort==="sire") arr.sort((a,b)=> String(a.sire||"～").localeCompare(String(b.sire||"～"), "ja") || (FEE_VAL[b.fee_tier]-FEE_VAL[a.fee_tier]));
  else if(mateSort==="surface") arr.sort((a,b)=> ((a.surface===m.surface?0:1)-(b.surface===m.surface?0:1)) || (FEE_VAL[b.fee_tier]-FEE_VAL[a.fee_tier]));
  else if(mateSort==="distShort") arr.sort((a,b)=> (a.dist[0]-b.dist[0]) || (a.dist[1]-b.dist[1]));
  else if(mateSort==="distLong") arr.sort((a,b)=> (b.dist[1]-a.dist[1]) || (b.dist[0]-a.dist[0]));
  else if(mateSort==="growth") arr.sort((a,b)=> (growOrd[a.growth]-growOrd[b.growth]) || (FEE_VAL[b.fee_tier]-FEE_VAL[a.fee_tier]));
  else if(mateSort==="feeDesc") arr.sort((a,b)=> FEE_VAL[b.fee_tier]-FEE_VAL[a.fee_tier]);
  else if(mateSort==="feeAsc") arr.sort((a,b)=> FEE_VAL[a.fee_tier]-FEE_VAL[b.fee_tier]);
  else if(mateSort==="remain") arr.sort((a,b)=> stallionRemain(a)-stallionRemain(b));
  return arr;
}

function toggleFav(name){

const FEE_VAL = {S:3000, A:1500, B:800, C:400};
function stallionRemain(st){ return Math.min(20-(S.year-(st.sinceYear||S.year)), (st.retireAge||29)-(st.age||12)); }
function sortedStallions(){
  const arr = S.stallions.slice();
  const surfOrd = {"芝":0, "ダート":1, "芝ダート":2};
  const growOrd = {"早熟":0, "普通":1, "晩成":2};
  if(stallionSort==="surface") arr.sort((a,b)=> (surfOrd[a.surface]-surfOrd[b.surface]) || (FEE_VAL[b.fee_tier]-FEE_VAL[a.fee_tier]));
  else if(stallionSort==="distShort") arr.sort((a,b)=> (a.dist[0]-b.dist[0]) || (a.dist[1]-b.dist[1]));
  else if(stallionSort==="distLong") arr.sort((a,b)=> (b.dist[1]-a.dist[1]) || (b.dist[0]-a.dist[0]));
  else if(stallionSort==="sire") arr.sort((a,b)=> String(a.sire||"～").localeCompare(String(b.sire||"～"), "ja") || (FEE_VAL[b.fee_tier]-FEE_VAL[a.fee_tier]));
  else if(stallionSort==="growth") arr.sort((a,b)=> (growOrd[a.growth]-growOrd[b.growth]) || (FEE_VAL[b.fee_tier]-FEE_VAL[a.fee_tier]));
  else if(stallionSort==="feeDesc") arr.sort((a,b)=> FEE_VAL[b.fee_tier]-FEE_VAL[a.fee_tier]);
  else if(stallionSort==="feeAsc") arr.sort((a,b)=> FEE_VAL[a.fee_tier]-FEE_VAL[b.fee_tier]);
  else if(stallionSort==="remain") arr.sort((a,b)=> stallionRemain(a)-stallionRemain(b));
  return arr.filter(st =>
    (stallionFilter.region==="all" || st.region===stallionFilter.region) &&
    (stallionFilter.surface==="all" || st.surface===stallionFilter.surface) &&
    (stallionFilter.fee==="all" || st.fee_tier===stallionFilter.fee) &&
    (stallionFilter.growth==="all" || st.growth===stallionFilter.growth) &&
    (!stallionFilter.favOnly || (S.favs||[]).includes(st.name)) &&
    (!stallionFilter.homeOnly || isHomebredStallion(st)));
}

function viewChron(){
  let html = "";
  /* ===== 殿堂：現役を終えた馬のうち、重賞勝ち or 獲得賞金1億円以上 ===== */
  const GRADED_SET = ["GI","GII","GIII","JpnI","JpnII","JpnIII","L"];
  const careerDone = h => h.retired || h.status==="broodmare" || h.status==="stallion";
  const hof = S.horses.filter(h => careerDone(h) && h.results.length>0
    && (h.results.some(r=>r.finish===1 && GRADED_SET.includes(r.grade)) || h.earnings>=10000))
    .sort((a,b)=>b.earnings-a.earnings);
  html += "<h3>🏆 殿堂</h3>";
  if(hof.length){
    const rows = hof.map(h => {
      const wins = h.results.filter(r=>r.finish===1);
      let best = null;
      for(const r of wins){ const rk = (GRADE_RANK[r.grade]!=null ? GRADE_RANK[r.grade] : 9); if(!best || rk<best.rk || (rk===best.rk && r.prize>best.r.prize)) best = { rk, r }; }
      const yrs = h.results.map(r=>parseInt(r.when,10)).filter(y=>!isNaN(y));
      const span = yrs.length ? Math.min(...yrs)+"〜"+Math.max(...yrs)+"年" : "";
      const now = h.status==="broodmare" ? "繁殖牝馬" : h.status==="stallion" ? "種牡馬" : "引退";
      return "<tr><td><span class='horse-link' data-horse='"+h.id+"'>"+h.name+"</span></td><td>"+h.sex+"</td><td>"+span+"</td><td>"+h.results.length+"戦"+h.wins+"勝</td><td>"+man(h.earnings)+"</td><td>"+(best?best.r.race+"（"+best.r.grade+"）":"―")+"</td><td>"+now+"</td></tr>";
    }).join("");
    html += "<table><tr><th>馬名</th><th>性</th><th>現役期間</th><th>成績</th><th>獲得賞金</th><th>代表勝ち鞍</th><th>現在</th></tr>"+rows+"</table>";
  } else {
    html += "<div class='sub'>まだ殿堂入りした馬はいません。重賞を勝つか1億円以上を稼いだ馬が現役を終えると、ここに残ります。</div>";
  }
  /* ===== 年ごとのまとめ ===== */
  const byYear = {};
  for(const h of S.horses) for(const r of h.results){
    const y = parseInt(r.when,10); if(isNaN(y)) continue;
    const a = byYear[y] || (byYear[y] = { starts:0, wins:0, prize:0, perHorse:{} });
    a.starts++; if(r.finish===1) a.wins++; a.prize += r.prize||0;
    a.perHorse[h.name] = (a.perHorse[h.name]||0) + (r.prize||0);
  }
  const births = {};
  for(const c of S.chronicle) if(c.text.indexOf("【誕生】")===0) births[c.y] = (births[c.y]||0)+1;
  const yrows = [];
  for(let y=2026; y<=S.year; y++){
    const a = byYear[y];
    let rep = "―";
    if(a){ let bn=null, bp=-1; for(const n in a.perHorse) if(a.perHorse[n]>bp){ bp=a.perHorse[n]; bn=n; } if(bn) rep = bn+"（"+man(bp)+"）"; }
    yrows.push("<tr><td>"+y+"年</td><td>"+(a?a.starts:0)+"</td><td>"+(a?a.wins:0)+"</td><td>"+(a?man(a.prize):"0円")+"</td><td>"+(births[y]||0)+"頭</td><td>"+rep+"</td></tr>");
  }
  html += "<h3 style='margin-top:16px;'>📖 牧場の歩み（年ごとのまとめ）</h3>"
    + "<table><tr><th>年</th><th>出走</th><th>勝利</th><th>獲得賞金</th><th>誕生</th><th>代表馬（その年の獲得賞金トップ）</th></tr>"+yrows.join("")+"</table>";
  /* ===== 年表（詳細ログ） ===== */
  const items = [...S.chronicle].reverse().slice(0,160).map(c=>"<div><span class='when'>"+c.y+"年"+c.m+"月第"+c.w+"週</span>"+c.text+"</div>").join("");
  html += "<h3 style='margin-top:16px;'>年表</h3><div class='chron'>"+items+"</div>";
  return html;
}

/* 血統表用：名前から父母を引く。所有馬（自家繁殖の牝系など）→種牡馬ロスター（父のみ記録）の順 */
function personRec(name){
  if(!name || name==="―") return null;
  const hh = S.horses.find(x=>x.name===name);
  if(hh) return { sire: hh.sire||null, dam: hh.dam||null };
  const st = S.stallions.find(x=>x.name===name);
  if(st) return { sire: st.sire||null, dam: null };
  return null;
}
function pedigreeTable(h){
  const cell = n => n ? n : "―";
  const s = h.sire, d = h.dam;
  const sr = personRec(s), dr = personRec(d);
  const ss = sr ? sr.sire : null, sd = sr ? sr.dam : null;
  const ds = (dr && dr.sire) || h.bms || null, dd = dr ? dr.dam : null;
  const par = n => n ? personRec(n) : null;
  const sss = par(ss) ? par(ss).sire : null, ssd = par(ss) ? par(ss).dam : null;
  const sds = par(sd) ? par(sd).sire : null, sdd = par(sd) ? par(sd).dam : null;
  const dss = par(ds) ? par(ds).sire : null, dsd = par(ds) ? par(ds).dam : null;
  const dds = par(dd) ? par(dd).sire : null, ddd = par(dd) ? par(dd).dam : null;
  return "<table class='ped'>"
    + "<tr><td class='sireline' rowspan='4'><span class='sub'>父</span><br>"+cell(s)+"</td><td class='sireline' rowspan='2'>"+cell(ss)+"</td><td>"+cell(sss)+"</td></tr>"
    + "<tr><td>"+cell(ssd)+"</td></tr>"
    + "<tr><td class='sireline' rowspan='2'>"+cell(sd)+"</td><td>"+cell(sds)+"</td></tr>"
    + "<tr><td>"+cell(sdd)+"</td></tr>"
    + "<tr><td class='damline' rowspan='4'><span class='sub'>母</span><br>"+cell(d)+"</td><td class='damline' rowspan='2'>"+cell(ds)+"</td><td>"+cell(dss)+"</td></tr>"
    + "<tr><td>"+cell(dsd)+"</td></tr>"
    + "<tr><td class='damline' rowspan='2'>"+cell(dd)+"</td><td>"+cell(dds)+"</td></tr>"
    + "<tr><td>"+cell(ddd)+"</td></tr></table>"
    + "<div class='sub'>3代血統表。記録がある範囲で表示します（種牡馬ロスターは父のみ記録のため、父系の母方は「―」になります）。代を重ねるほど自家生産の牝系が埋まっていきます。</div>";

  // 既存の年・月・週の入力はそのまま残し、こちらは入力なしで進められる。
  document.querySelectorAll("[data-rel-months]").forEach(btn => btn.onclick = () => {
    const n = parseInt(btn.getAttribute("data-rel-months"),10);
    const total = (S.year-2026)*12 + (S.month-1) + n;
    skipTo(2026 + Math.floor(total/12), (total % 12) + 1, S.week);
  });
  const MILESTONES = { foal:[1,1], breed:[2,1], yearend:[12,4] }; // [月, 週]（出産=1月、繁殖=2月、年末=12月第4週）
  document.querySelectorAll("[data-milestone]").forEach(btn => btn.onclick = () => {
    const [m, w] = MILESTONES[btn.getAttribute("data-milestone")];
    for(let y=S.year; y<=S.year+1; y++){
      const target = (y-2026)*48 + (m-1)*4 + (w-1);
      if(target > absWeek()){ skipTo(y, m, w); return; }

      if(!data || !Array.isArray(data.horses) || typeof data.year !== "number" || !Array.isArray(data.stallions)) throw new Error("bad save");
      if(!confirm("このセーブを読み込みますか？（今のデータは置き換わります）")) return;
      S = data; ensureParams(); save(); render();
      topic("📥 セーブを読み込みました");
    } catch(e){ alert("読み込めませんでした（セーブファイルの形式が違うようです）"); }
  };
  rd.readAsText(file);
  ev.target.value = "";
};
$("#horseModal").onclick = e => { if(e.target.id==="horseModal") e.target.style.display="none"; };
if(!load()) initState();
ensureParams();
render();
</script>
</body>
</html>
