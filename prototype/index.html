<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NKC / WHC 競馬ゲーム試作</title>
<style>
  :root { --bg:#10160f; --panel:#1b241a; --panel2:#232f22; --line:#3a4a38; --txt:#e8f0e4; --sub:#a9bfa2; --acc:#7fe07a; --warn:#ffcf6e; --bad:#ff8f8f; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Hiragino Sans","Noto Sans JP",sans-serif; background:var(--bg); color:var(--txt); }
  header { background:#0b100a; border-bottom:1px solid var(--line); padding:10px 16px; display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; }
  header .date { font-size:20px; font-weight:700; }
  header .funds { color:var(--warn); font-weight:700; }
  button { background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer; font-size:14px; }
  button:hover { border-color:var(--acc); }
  button.primary { background:#2c5b2a; border-color:var(--acc); font-weight:700; }
  button:disabled { opacity:.38; cursor:not-allowed; }
  main { max-width:1180px; margin:0 auto; padding:14px; display:grid; grid-template-columns:1fr; gap:14px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .panel h2 { margin:2px 0 10px; font-size:16px; }
  .tabs { display:flex; gap:8px; flex-wrap:wrap; }
  .tabs button.active { background:#2c5b2a; border-color:var(--acc); }
  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th, td { border-bottom:1px solid var(--line); padding:5px 6px; text-align:left; vertical-align:top; }
  th { color:var(--sub); font-weight:600; }
  .entryscroll { max-height:52vh; overflow-y:auto; border:1px solid var(--line); border-radius:8px; margin-top:6px; -webkit-overflow-scrolling:touch; }
  .entryscroll th { position:sticky; top:0; background:var(--panel); z-index:1; }
  .ped td { background:var(--panel2); }
  .ped td.sireline { background:#22382a; }
  .ped td.damline { background:#382631; }
  .sub { color:var(--sub); font-size:12.5px; }
  .topic { border-left:3px solid var(--acc); padding:4px 8px; margin:6px 0; background:var(--panel2); border-radius:0 8px 8px 0; }
  .chron { font-size:13.5px; line-height:1.75; }
  .chron .when { color:var(--sub); margin-right:8px; }
  .ok { color:var(--acc); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  select, input[type=text] { background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:6px 8px; font-size:14px; }
  .flex { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .horse-link { color:var(--acc); cursor:pointer; text-decoration:underline; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.66); display:none; z-index:20; }
  .modal .box { background:var(--panel); border:1px solid var(--line); border-radius:12px; max-width:760px; margin:5vh auto; padding:18px; max-height:88vh; overflow:auto; }
  .kv { display:grid; grid-template-columns:110px 1fr; gap:4px 10px; font-size:14px; }
  .kv dt { color:var(--sub); } .kv dd { margin:0; }
  .chip { display:inline-block; border:1px solid var(--acc); color:var(--acc); border-radius:10px; padding:0 7px; margin:1px 2px 1px 0; font-size:11.5px; }
  .hdrmenu { position:relative; display:inline-block; }
  .hdrmenu summary { cursor:pointer; list-style:none; background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:14px; }
  .hdrmenu summary::-webkit-details-marker { display:none; }
  .hdrmenu-body { position:absolute; right:0; top:calc(100% + 6px); background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px; z-index:30; min-width:220px; box-shadow:0 8px 24px rgba(0,0,0,.5); }
  footer { margin:26px 4px 10px; padding-top:10px; border-top:1px solid var(--line); color:var(--sub); font-size:12.5px; text-align:right; }
  .sellmenu { margin:10px 0; border:1px solid var(--line); border-radius:10px; padding:8px 10px; background:var(--panel2); }
  .sellmenu summary { cursor:pointer; font-size:14px; }
  .sellmenu-body { margin-top:8px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
</style>
</head>
<body>
<header>
  <div class="date" id="dateLabel"></div>
  <div class="funds" id="fundsLabel"></div>
  <div class="flex">
    <button class="primary" id="nextWeekBtn">週を進める ▶</button>
    <button id="nextEventBtn">次のイベントまで ⏩</button>
    <button class="ghost" id="debugHorseBtn">🐛 デバッグ馬を作成</button>
    <details class="hdrmenu"><summary>⚙ その他</summary><div class="hdrmenu-body"><button id="resetBtn">最初から（データ削除）</button><div class="sub">セーブデータを消して最初からやり直します</div></div></details>
    <button class="ghost" id="exportBtn">💾 書き出し</button>
    <button class="ghost" id="importBtn">📥 読み込み</button>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none;">
  </div>
  <div class="flex">
    <span class="sub">指定週まで：</span>
    <button class="ghost" id="skipYearMinus">−1年</button>
    <input type="text" id="skipYear" size="5" value="2027">
    <button class="ghost" id="skipYearPlus">+1年</button>
    <span class="sub">年</span>
    <select id="skipMonth"></select>
    <span class="sub">月 第</span>
    <select id="skipWeek"><option>1</option><option>2</option><option>3</option><option>4</option></select>
    <span class="sub">週まで</span>
    <button id="skipBtn">スキップ ⏭</button>
  </div>
  <div class="flex">
    <span class="sub">かんたんスキップ：</span>
    <button class="ghost" data-rel-months="1">+1ヶ月</button>
    <button class="ghost" data-rel-months="3">+3ヶ月</button>
    <button class="ghost" data-rel-months="6">+6ヶ月</button>
    <button class="ghost" data-rel-months="12">+1年</button>
    <button class="ghost" data-rel-months="36">+3年</button>
    <button class="ghost" data-rel-months="60">+5年</button>
    <span class="sub">｜</span>
    <button class="ghost" data-milestone="foal">次の出産シーズン（1月）</button>
    <button class="ghost" data-milestone="breed">次の繁殖シーズン（2月）</button>
    <button class="ghost" data-milestone="yearend">年末（12月第4週）</button>
  </div>
  <div class="sub">目標なし・週刻み・過程を見つめるゲーム。開始時に繁殖牝馬を1頭選ぶところから始まります。初年度は4月に2歳馬、12月に1歳馬の贈呈があります（辞退も可）。能力は設計用の仮数値、海外レースの1着賞金は2025年の実額（racedb調べ・固定レート換算）です。スキップは「かんたんスキップ」のボタンでも進められます。「🐛 デバッグ馬を作成」ではステータスを指定して馬を作れます（動作確認用）。</div>
</header>
<main>
  <section class="panel" id="topicPanel"><h2>今週のトピック</h2><div id="topics"></div></section>
  <section class="panel">
    <div class="tabs" id="tabs">
      <button data-tab="horses" class="active">所有馬</button>
      <button data-tab="entry">出走登録</button>
      <button data-tab="breed">繁殖（2〜6月）</button>
      <button data-tab="stallions">種牡馬</button>
      <button data-tab="chron">牧場年表</button>
    </div>
    <div id="tabBody" style="margin-top:12px;"></div>
  </section>
</main>
<div class="modal" id="horseModal"><div class="box" id="horseModalBox"></div></div>

/* ================= レース適否 ================= */
function eligibility(h, race){
  const age = ageOf(h);

  if(c.includes("2歳") && !c.includes("2歳以上") && age!==2) return "2歳限定";
  if(/(^|[^0-9])3歳以上/.test(c) && age<3) return "3歳以上限定";
  if(c.includes("4歳以上") && age<4) return "4歳以上限定";
  if(/(^|[^0-9])4歳/.test(c) && !c.includes("4歳以上") && age!==4) return "4歳限定";
  if(/(^|[^0-9])3歳/.test(c) && !c.includes("3歳以上") && age!==3) return "3歳限定";

  if(c.includes("牝") && !c.includes("牡") && h.sex!=="牝") return "牝馬限定";
  if(c.includes("牡") && !c.includes("牝") && h.sex!=="牡") return "牡馬限定";
  const g = race.grade;
  if(race.general){
    if(g==="新馬" && (h.wins>0 || h.results.length>0)) return "新馬戦は未出走馬のみ";
    if(g==="未勝利" && h.wins>0) return "未勝利戦は未勝利馬のみ";
  }
  // クラス戦（一般・特別共通）：勝ち上がった馬は前のクラスには出られない。未勝利馬は新馬・未勝利戦のみ
  // 未勝利のまま年齢・時期が過ぎた馬には出走できるレースが残らない＝実質引退（Terai決定 2026-11-12）
  const CLASS_LIM = {"1勝クラス":1, "2勝クラス":2, "3勝クラス":3};
  if(CLASS_LIM[g] != null){
    if(h.wins===0) return "未勝利馬は新馬・未勝利戦のみ出走できます";
    if(h.gradedWin || h.wins > CLASS_LIM[g]) return "クラス超過";

  if(!race.general && h.wins===0) return "未勝利馬は新馬・未勝利戦のみ出走できます";

    if(!h.gradedWin && !placed) return "海外遠征には国内の重賞・リステッドでの勝利か3着以内が必要です";
  }
  if(age===2 && S.month<6 && !race.general) return "2歳の重賞出走は6月以降（試作ルール）";

}
function aptitudeFactor(h, race){
  let f = 1;
  if(race.surface && h.surface!=="両刀" && h.surface!==race.surface) f *= 0.90;
  const d = race.distance_m;

}
/* ================= 斤量（負担重量） =================

   定量・馬齢は全馬同条件なので、従来どおりスコアには影響させない。
   ハンデ・別定だけ斤量差をスコアへ反映する：基準57kg（WEIGHT_REF）から 1kg = スコア0.4%（KG_SCORE）。
   基準斤量は簡略化したJRA馬齢重量表（年齢と性別のみ。距離別テーブルは使わない） */

function weightTypeOf(race){ return race.weight_type || "馬齢"; }
function baseWeight(h){
  const age = ageOf(h);
  const mare = h.sex==="牝" ? -2 : 0;

  if(age===3) return (S.month>=10 ? 56 : 55) + mare; // 3歳は秋（10月）から+1kg

}
function gradedWins(h, grades){ return h.results.filter(r=>r.finish===1 && grades.includes(r.grade)).length; }
/* 別定（簡易JRA式）：基準斤量 ＋ 重賞勝ち加算
   （GI/JpnI勝ち +2、GII/JpnII勝ち +1、GIII/JpnIII/リステッド勝ち +0.5、加算の上限 +4） */
function betteiWeight(h){
  const add = gradedWins(h,["GI","JpnI"])*2 + gradedWins(h,["GII","JpnII"])*1 + gradedWins(h,["GIII","JpnIII","L"])*0.5;

/* ハンデ：基準-2kgを起点に実績で増減する（JRAハンデの考え方の簡易版）。
   重賞勝ち：GI/JpnI +2（上限+4）、GII/JpnII +1.5（上限+3）、GIII/JpnIII/L +1（上限+2）
   総勝利数：2勝目から1勝ごとに +0.25（上限+1.5）。獲得賞金：2億円ごとに +1（上限+2）
   実績が薄い馬は軽くなる（未勝利 -2、獲得賞金1,000万円未満 -1）。加算は -3〜+6 に丸め、

function handicapWeight(h){
  let add = Math.min(4, gradedWins(h,["GI","JpnI"])*2)
          + Math.min(3, gradedWins(h,["GII","JpnII"])*1.5)
          + Math.min(2, gradedWins(h,["GIII","JpnIII","L"])*1)
          + Math.min(1.5, Math.max(0, h.wins-1)*0.25)
          + Math.min(2, h.earnings/20000);

function assignedWeight(race, h){
  const wt = weightTypeOf(race);
  if(wt==="ハンデ") return handicapWeight(h);
  if(wt==="別定") return betteiWeight(h);
  return baseWeight(h); // 定量・馬齢：表示・記録用に基準斤量を返すが、スコアには使わない
}
/* 相手馬の斤量：生成された強さから割り付け、強い相手ほど重くなるようにする */
function rivalWeight(race, strength){
  const wt = weightTypeOf(race);
  const [rlo, rhi] = rivalStrength(race);
  const mid = (rlo+rhi)/2;
  if(wt==="ハンデ") return clamp(Math.round((55 + (strength-mid)*0.35)*2)/2, 48, 62);
  if(wt==="別定") return WEIGHT_REF + (strength>mid+6 ? 2 : strength>mid+2 ? 1 : 0);

function weightFactor(w){ return 1 - (w - WEIGHT_REF) * KG_SCORE; }
/* ================= レース実行 ================= */
function runRace(race, entries){
  const fs = Math.max(fieldSize(race), entries.length+6);
  const [rlo, rhi] = rivalStrength(race);
  const pace = pickPace();
  const wtActive = weightTypeOf(race)==="ハンデ" || weightTypeOf(race)==="別定"; // 斤量差が効くのはこの2区分だけ
  const runners = [];
  for(const h of entries){
    const gut = paramNow(h,"gut");
    const spread = 0.10 * (1 - clamp((gut-40)/60, 0, 1) * 0.5) * (STYLE_VAR[styleOf(h)] || 1) * tempSpreadMul(h);
    const w = wtActive ? assignedWeight(race, h) : null;
    runners.push({ horse:h, weight:w, score: raceBase(h,race)*aptitudeFactor(h,race)*styleFactor(h,pace)*(w!=null ? weightFactor(w) : 1)*(1 + rnd(-1,1)*spread), gut });
  }
  const nRivals = fs - entries.length;
  for(let i=0;i<nRivals;i++){
    const s = rnd(rlo,rhi)*rnd(0.88,1.1);

    runners.push({ horse:null, weight:rw, score: rw!=null ? s*weightFactor(rw) : s });
  }

  for(let i=1;i<runners.length;i++){

    const gap = up.score - dn.score;
    if(gap >= 0 && gap < 1.2 && Math.random() < Math.max(0, (dn.gut||70) - 70) * 0.01){
      runners[i-1] = dn; runners[i] = up;
    }
  }

  const baseTime = race.distance_m ? race.distance_m/16.8 : 100;
  const resultsOut = [];
  runners.forEach((r, idx) => {
    if(!r.horse) return;
    const h = r.horse;
    const finish = idx+1;
    const prize = finish<=5 ? prizes[finish-1] : 0;
    const rec = { when: S.year+"年"+S.month+"月第"+S.week+"週", race: race.name, grade: race.grade||"", course: race.racecourse||"",
      surface: race.surface||"", dist: race.distance_m||null, finish, field: fs, pace, style: styleOf(h),
      pass: passPositions(styleOf(h), finish, fs, h.quirk), comment: raceComment(styleOf(h), pace, finish, h.quirk),
      weight: (r.weight!=null ? r.weight : null),
      time: race.distance_m ? (baseTime + idx*0.35 + rnd(0,0.5)).toFixed(1) : "", agari: (rnd(33.2,36.8)).toFixed(1), prize };
    h.results.push(rec); h.earnings += prize; S.funds += prize;
    if(finish===1){ h.wins++; if(["GI","GII","GIII","JpnI","JpnII","JpnIII","L"].includes(race.grade)) h.gradedWin = true; }
    h.fatigue = clamp(h.fatigue + irnd(34,52), 0, 100);
    h.condition = clamp(h.condition - irnd(6,16), 5, 100);
    h.lastRaceAbs = absWeek(); h.enteredStyle = null;
    resultsOut.push({h, finish, prize});
    chron("【レース】"+race.name+"（"+(race.grade||"")+"・"+(race.racecourse||"")+"） "+h.name+" "+finish+"着／"+fs+"頭"+(prize?"、賞金"+man(prize):"")+"（"+pace+"・"+rec.style+(rec.weight!=null ? "・斤量"+rec.weight.toFixed(1)+"kg" : "")+"）");
    if(finish===1) topic("🏆 "+h.name+" が "+race.name+" を勝ちました");
  });
  return resultsOut;
}
/* ================= 週送り ================= */
function advanceWeek(){

    const entries = S.horses.filter(h=>h.entries && h.entries[absWeek()] && h.entries[absWeek()].key===key && h.status==="racehorse" && !h.retired);

/* 成長型の継承：内部7段階チェーンで、父母どちらか＋15％で隣の型へ1段階ずれる */
function inheritGrowth(a, b){
  let g = Math.random()<0.5 ? a : b;

    const i = G_CHAIN.indexOf(g);
    if(i>=0) g = G_CHAIN[clamp(i + (Math.random()<0.5 ? -1 : 1), 0, G_CHAIN.length-1)];
  }

function weeklyEvents(){

  if(S.month===3 && S.week===1) topic("🐴 春の出産シーズンです（昨年の種付け分は年始に誕生済み）");

  if(S.month===12 && S.week===4) topic("📅 年末です。週を進めると年が替わり、出産が起きます");
  if(S.month===11 && S.week===1 && S.salePool && S.salePool.length) topic("🐴 繁殖牝馬セールが始まりました（11〜12月、「繁殖」タブ）。最初に選ばなかった候補も出ています");
  if(S.year===2026 && S.month===4 && S.week===1 && !S.giftAprDone){ S.giftAprDone = true; S.giftQueue.push(makeGift("2yo")); topic("🎁 初年度の支援で2歳馬が贈られます。名前を付けて迎えるか、辞退もできます"); }
  if(S.year===2026 && S.month===12 && S.week===1 && !S.giftDecDone){ S.giftDecDone = true; S.giftQueue.push(makeGift("1yo")); topic("🎁 初年度の支援で1歳馬が贈られます。名前を付けて迎えるか、辞退もできます"); }
  for(const h of S.horses){
    if(h.status==="racehorse" && ageOf(h)>=7 && !h.retireNudged){ h.retireNudged = true; topic("引退を考え始める時期です："+h.name+"（"+ageOf(h)+"歳）。馬のページから引退させられます"); }
    if(h.status==="racehorse" && h.fatigue>=80) topic("⚠️ "+h.name+" の疲労がかなり溜まっています。放牧か休養がおすすめです");
    if(h.status==="racehorse" && growthStage(h)==="充実期" && !h.peakNoted){ h.peakNoted = true; topic("🌟 "+h.name+" が充実期に入りました（"+h.growth+"）"); }
    /* ピークアウト通知（v0.29）：成熟度がピークを過ぎて下降に転じたら1頭につき1回だけ知らせる。内部型は伏せたまま */
    if(h.status==="racehorse" && !h.peakOutNoted){
      const aF = ageOf(h) + (S.month-1)/12;
      if(aF > (G_PEAK[gtypeOf(h)] || 4.6) && maturityA(h, aF) < maturityA(h, aF - 0.25) - 0.001){ h.peakOutNoted = true; topic("📉 "+h.name+" はピークを過ぎたようです（"+ageOf(h)+"歳）"); }
    }
  }
  // 成長イベント：毎月第3週、若い馬の様子が年表に残る
  if(S.week===3){
    const young = S.horses.filter(h => !h.retired && (h.status==="foal" || h.status==="yearling" || (h.status==="racehorse" && ageOf(h)<=3)));

    }
  }
}
function nextEvent(){

  S.silent = true;

function skipTo(y, m, w){
  // 指定した年・月・週まで進める（最大50年分）。途中の出来事は年表に残る。
  const target = (y-2026)*48 + (m-1)*4 + (w-1);
  let guard = 0;
  S.silent = true;
  while(absWeek() < target && guard++ < 2400) advanceWeek();
  S.silent = false;
  if(absWeek() >= target) chron("【スキップ】"+y+"年"+m+"月第"+w+"週まで進めた");
  else chron("【スキップ】上限のため "+S.year+"年"+S.month+"月第"+S.week+"週 で停止した");
  save(); render();
}

const GRADE_RANK = {"GI":0,"G1":0,"JpnI":0,"GII":1,"G2":1,"JpnII":1,"J-GI":1,"GIII":2,"G3":2,"JpnIII":2,"J-GII":2,"L":3,"J-GIII":3,"オープン":4};
function sortedRacesFor(h, wk){
  const mid = (h.distMin + h.distMax) / 2;
  const arr = wk.map(r => ({ r, reason: eligibility(h, r), apt: aptitudeFactor(h, r) }));
  const gr = x => (GRADE_RANK[x.r.grade] != null ? GRADE_RANK[x.r.grade] : (x.r.general ? 6 : 5));
  const dist = x => (x.r.distance_m == null ? 99999 : x.r.distance_m);
  if(entrySort==="recommend") arr.sort((a,b)=> ((a.reason?1:0)-(b.reason?1:0)) || (b.apt-a.apt) || (gr(a)-gr(b)));
  else if(entrySort==="near") arr.sort((a,b)=> (Math.abs(dist(a)-mid)-Math.abs(dist(b)-mid)) || (gr(a)-gr(b)));
  else if(entrySort==="distAsc") arr.sort((a,b)=> dist(a)-dist(b));
  else if(entrySort==="distDesc") arr.sort((a,b)=> (dist(b)===99999?-1:dist(b)) - (dist(a)===99999?-1:dist(a)));
  else if(entrySort==="grade") arr.sort((a,b)=> (gr(a)-gr(b)) || (prizeTable(b.r)[0]-prizeTable(a.r)[0]));
  else if(entrySort==="course") arr.sort((a,b)=> String(a.r.racecourse||"").localeCompare(String(b.r.racecourse||""), "ja") || (gr(a)-gr(b)));
  else if(entrySort==="prize") arr.sort((a,b)=> prizeTable(b.r)[0]-prizeTable(a.r)[0]);
  return arr;
}
function drawEntryList(){
  const box = $("#entryList"); if(!box) return;

  const wk = racesThisWeek(ty, tm, tw);

  const okCount = arr.filter(x=>!x.reason).length;
  if(entryOnlyOk) arr = arr.filter(x=>!x.reason);
  const rows = arr.map(({r, reason, apt}) => {
    const key = targetAbs+"@"+r.name+"|"+(r.racecourse||"")+"|"+(r.grade||"");
    const mark = !reason && apt>=0.99 ? "◎" : !reason && apt>=0.93 ? "○" : "";
    const ent = h.entries ? h.entries[targetAbs] : null;
    const entered = !!(ent && ent.key===key);
    const btn = reason ? "<span class='bad'>"+reason+"</span>"
      : entered ? "<button data-unenter='"+h.id+"'>登録取消</button>"
      : ent ? "<button data-enter='"+h.id+"' data-key='"+key+"'>この週の登録を差し替え</button>"
      : "<button data-enter='"+h.id+"' data-key='"+key+"'>出走登録</button>";
    const chips = (r.labels||[]).map(l=>"<span class='chip'>"+l+"</span>").join("");
    const wt = weightTypeOf(r);
    const wnote = (wt==="ハンデ" || wt==="別定") ? "<br><span class='sub'>"+wt+"戦：この馬の斤量 "+assignedWeight(r,h).toFixed(1)+"kg（登録前に確認できます。重ければ見送る判断も）</span>" : "";
    const trialsBtn = (r.grade==="GI" || r.grade==="JpnI") ? " <button data-trials='"+r.name+"' class='ghost'>トライアル一覧</button>" : "";
    return "<tr"+(reason?" style='opacity:.45'":"")+"><td>"+mark+"</td><td>"+raceLabel(r)+(chips?"<br>"+chips:"")+wnote+trialsBtn+"</td><td>"+(r.sector==="overseas"?"海外・WHC":r.sector==="regional"?"地方":"中央・NKC")+"</td><td>1着賞金 "+man(prizeTable(r)[0])+"</td><td>"+btn+"</td></tr>";
  }).join("");
  let trialsHtml = "";
  if(trialsFor){
    const trs = DATA.domestic.filter(r=>(r.labels||[]).includes("トライアル："+trialsFor));
    trialsHtml = "<div class='topic'><b>"+trialsFor+" のトライアル</b>（ローテ設計用の情報です）："
      + (trs.length ? trs.map(r=>r.name+"（"+r.grade+"・"+r.month+"月第"+r.wom+"週・"+r.racecourse+" "+r.surface+r.distance_m+"m）").join("／") : "登録されたトライアルはありません")
      + " <button data-trials-close='1' class='ghost'>閉じる</button></div>";
  }
  const entHere = h.entries ? h.entries[targetAbs] : null;
  const entRace = entHere ? wk.find(r => targetAbs+"@"+r.name+"|"+(r.racecourse||"")+"|"+(r.grade||"") === entHere.key) : null;
  const entNote = entHere ? "<div class='topic'>📝 この週は <b>"+(entRace ? entRace.name : "登録済みレース")+"</b> に登録済みです（別のレースを選ぶと差し替わります）</div>" : "";
  box.innerHTML = trialsHtml + entNote + "<div class='sub'>絞込み後 "+arr.length+" 件（うち出走可能 "+okCount+" 件）／"+tm+"月第"+tw+"週の全 "+wk.length+" レース</div>"
    + "<div class='entryscroll'><table><tr><th></th><th>レース</th><th>区分</th><th>賞金</th><th></th></tr>"+rows+"</table></div>";
  document.querySelectorAll("[data-enter]").forEach(btn => btn.onclick = () => {
    if(!h.entries) h.entries = {};
    h.entries[targetAbs] = { key: btn.getAttribute("data-key"), style: h.stylePref || bestStyle(h) };
    topic("📝 "+h.name+" を "+tm+"月第"+tw+"週 のレースに登録しました（その週に自動で実施されます）");
    save(); render();
  });
  document.querySelectorAll("[data-unenter]").forEach(btn => btn.onclick = () => { if(h.entries) delete h.entries[targetAbs]; save(); render(); });
  document.querySelectorAll("[data-trials]").forEach(btn => btn.onclick = () => { trialsFor = btn.getAttribute("data-trials"); drawEntryList(); });
  const tc = document.querySelector("[data-trials-close]"); if(tc) tc.onclick = () => { trialsFor = null; drawEntryList(); };
}

/* 自家製種牡馬か（自牧場の馬が種牡馬入りしたもの。ロスターの自動補充組は含まない） */
function isHomebredStallion(st){ return S.horses.some(h=>h.status==="stallion" && h.name===st.name); }
function compatScore(m, st){
  let s = 0;
  if(st.surface===m.surface) s += 2; else if(st.surface==="芝ダート" || m.surface==="芝ダート") s += 1;
  const overlap = Math.min(m.distMax, st.dist[1]) - Math.max(m.distMin, st.dist[0]);
  if(overlap>=400) s += 2; else if(overlap>=0) s += 1;
  return s;
}
function compatMark(m, st){ const s = compatScore(m, st); return s>=4 ? "◎" : s>=2 ? "○" : s>=1 ? "△" : "×"; }
function inbreedNote(m, st){
  if(st.name===m.sire) return "父と同一（インブリード）";
  if(st.name===m.bms) return "母父と同一";
  if(st.sire && st.sire===m.sire) return "父系が近い";
  return "";
}
function mateWith(m, st){
  const f = FEE_VAL[st.fee_tier];
  if(S.funds < f){ topic("⚠️ 資金が足りません"); save(); render(); return; }
  S.funds -= f;
  m.lastSire = st.name;
  const guaranteed = !S.firstMatingDone; // 最初の1回だけ受胎確定（滑り出しで詰まらないための配慮）
  if(guaranteed || Math.random() < 0.85){ S.firstMatingDone = true; m.pregnant = { sire: st.name, dueYear: S.year+1 }; chron("【種付け】"+m.name+" × "+st.name+"（種付料"+f+"万円）"); topic("🌸 "+m.name+" が "+st.name+" を受胎しました（来年出産予定）"); }
  else { chron("【種付け】"+m.name+" × "+st.name+" は不受胎だった"); topic(m.name+" は不受胎でした。また来年。"); }
  save(); render();
}
function sortedForMating(m){
  const arr = S.stallions.filter(st =>
    (mateFilter.region==="all" || st.region===mateFilter.region) &&
    (mateFilter.surface==="all" || st.surface===mateFilter.surface) &&
    (mateFilter.feeMax==="all" || FEE_VAL[st.fee_tier] <= parseInt(mateFilter.feeMax,10)) &&
    (!mateFilter.homeOnly || isHomebredStallion(st)));
  const growOrd = {"早熟":0, "普通":1, "晩成":2};
  if(mateSort==="recommend") arr.sort((a,b)=> (compatScore(m,b)-compatScore(m,a)) || (((S.favs||[]).includes(b.name)?1:0)-((S.favs||[]).includes(a.name)?1:0)) || (FEE_VAL[b.fee_tier]-FEE_VAL[a.fee_tier]));
  else if(mateSort==="sire") arr.sort((a,b)=> String(a.sire||"～").localeCompare(String(b.sire||"～"), "ja") || (FEE_VAL[b.fee_tier]-FEE_VAL[a.fee_tier]));
  else if(mateSort==="surface") arr.sort((a,b)=> ((a.surface===m.surface?0:1)-(b.surface===m.surface?0:1)) || (FEE_VAL[b.fee_tier]-FEE_VAL[a.fee_tier]));
  else if(mateSort==="distShort") arr.sort((a,b)=> (a.dist[0]-b.dist[0]) || (a.dist[1]-b.dist[1]));
  else if(mateSort==="distLong") arr.sort((a,b)=> (b.dist[1]-a.dist[1]) || (b.dist[0]-a.dist[0]));
  else if(mateSort==="growth") arr.sort((a,b)=> (growOrd[a.growth]-growOrd[b.growth]) || (FEE_VAL[b.fee_tier]-FEE_VAL[a.fee_tier]));
  else if(mateSort==="feeDesc") arr.sort((a,b)=> FEE_VAL[b.fee_tier]-FEE_VAL[a.fee_tier]);
  else if(mateSort==="feeAsc") arr.sort((a,b)=> FEE_VAL[a.fee_tier]-FEE_VAL[b.fee_tier]);
    return arr;
}

let stallionSort = "standard";
let stallionFilter = { region:"all", surface:"all", fee:"all", growth:"all", favOnly:false, homeOnly:false };
function toggleFav(name){
  if(!S.favs) S.favs = [];
  const i = S.favs.indexOf(name);
  if(i>=0) S.favs.splice(i,1); else S.favs.push(name);
  save(); render();
}
const FEE_VAL = {S:3000, A:1500, B:800, C:400};
function sortedStallions(){
  const arr = S.stallions.slice();
  const surfOrd = {"芝":0, "ダート":1, "芝ダート":2};
  const growOrd = {"早熟":0, "普通":1, "晩成":2};
  if(stallionSort==="surface") arr.sort((a,b)=> (surfOrd[a.surface]-surfOrd[b.surface]) || (FEE_VAL[b.fee_tier]-FEE_VAL[a.fee_tier]));
  else if(stallionSort==="distShort") arr.sort((a,b)=> (a.dist[0]-b.dist[0]) || (a.dist[1]-b.dist[1]));
  else if(stallionSort==="distLong") arr.sort((a,b)=> (b.dist[1]-a.dist[1]) || (b.dist[0]-a.dist[0]));
  else if(stallionSort==="sire") arr.sort((a,b)=> String(a.sire||"～").localeCompare(String(b.sire||"～"), "ja") || (FEE_VAL[b.fee_tier]-FEE_VAL[a.fee_tier]));
  else if(stallionSort==="growth") arr.sort((a,b)=> (growOrd[a.growth]-growOrd[b.growth]) || (FEE_VAL[b.fee_tier]-FEE_VAL[a.fee_tier]));
  else if(stallionSort==="feeDesc") arr.sort((a,b)=> FEE_VAL[b.fee_tier]-FEE_VAL[a.fee_tier]);
  else if(stallionSort==="feeAsc") arr.sort((a,b)=> FEE_VAL[a.fee_tier]-FEE_VAL[b.fee_tier]);
  return arr.filter(st =>
    (stallionFilter.region==="all" || st.region===stallionFilter.region) &&
    (stallionFilter.surface==="all" || st.surface===stallionFilter.surface) &&
    (stallionFilter.fee==="all" || st.fee_tier===stallionFilter.fee) &&
    (stallionFilter.growth==="all" || st.growth===stallionFilter.growth) &&
    (!stallionFilter.favOnly || (S.favs||[]).includes(st.name)) &&
    (!stallionFilter.homeOnly || isHomebredStallion(st)));
}

function viewChron(){

  const hof = S.horses.filter(h => careerDone(h) && h.results.length>0
    && (h.results.some(r=>r.finish===1 && ["GI","JpnI"].includes(r.grade)) || h.earnings>=50000))
    .sort((a,b)=>b.earnings-a.earnings);

      for(const r of wins){ const rk = (GRADE_RANK[r.grade]!=null ? GRADE_RANK[r.grade] : 9); if(!best || rk<best.rk || (rk===best.rk && r.prize>best.r.prize)) best = { rk, r }; }

    }).join("");
    html += "<table><tr><th>馬名</th><th>性</th><th>現役期間</th><th>成績</th><th>獲得賞金</th><th>代表勝ち鞍</th><th>現在</th></tr>"+rows+"</table>";
  } else {

    const a = byYear[y] || (byYear[y] = { starts:0, wins:0, prize:0, perHorse:{} });
    a.starts++; if(r.finish===1) a.wins++; a.prize += r.prize||0;
    a.perHorse[h.name] = (a.perHorse[h.name]||0) + (r.prize||0);
  }
  const births = {};
  for(const c of S.chronicle) if(c.text.indexOf("【誕生】")===0) births[c.y] = (births[c.y]||0)+1;
  const yrows = [];
  for(let y=2026; y<=S.year; y++){
    const a = byYear[y];
    let rep = "―";
    if(a){ let bn=null, bp=-1; for(const n in a.perHorse) if(a.perHorse[n]>bp){ bp=a.perHorse[n]; bn=n; } if(bn) rep = bn+"（"+man(bp)+"）"; }

    + "<table><tr><th>年</th><th>出走</th><th>勝利</th><th>獲得賞金</th><th>誕生</th><th>代表馬（その年の獲得賞金トップ）</th></tr>"+yrows.join("")+"</table>";
  /* ===== 年表（詳細ログ） ===== */

/* 血統表用：名前から父母を引く。所有馬（自家繁殖の牝系など）→種牡馬ロスター（父のみ記録）の順 */
function personRec(name){
  if(!name || name==="―") return null;
  const hh = S.horses.find(x=>x.name===name);
  if(hh) return { sire: hh.sire||null, dam: hh.dam||null };
  const st = S.stallions.find(x=>x.name===name);
  if(st) return { sire: st.sire||null, dam: null };
  return null;
}
function pedigreeTable(h){
  const cell = n => n ? n : "―";
  const s = h.sire, d = h.dam;
  const sr = personRec(s), dr = personRec(d);
  const ss = sr ? sr.sire : null, sd = sr ? sr.dam : null;
  const ds = (dr && dr.sire) || h.bms || null, dd = dr ? dr.dam : null;
  const par = n => n ? personRec(n) : null;
  const sss = par(ss) ? par(ss).sire : null, ssd = par(ss) ? par(ss).dam : null;
  const sds = par(sd) ? par(sd).sire : null, sdd = par(sd) ? par(sd).dam : null;
  const dss = par(ds) ? par(ds).sire : null, dsd = par(ds) ? par(ds).dam : null;
  const dds = par(dd) ? par(dd).sire : null, ddd = par(dd) ? par(dd).dam : null;
  return "<table class='ped'>"
    + "<tr><td class='sireline' rowspan='4'><span class='sub'>父</span><br>"+cell(s)+"</td><td class='sireline' rowspan='2'>"+cell(ss)+"</td><td>"+cell(sss)+"</td></tr>"
    + "<tr><td>"+cell(ssd)+"</td></tr>"
    + "<tr><td class='sireline' rowspan='2'>"+cell(sd)+"</td><td>"+cell(sds)+"</td></tr>"
    + "<tr><td>"+cell(sdd)+"</td></tr>"
    + "<tr><td class='damline' rowspan='4'><span class='sub'>母</span><br>"+cell(d)+"</td><td class='damline' rowspan='2'>"+cell(ds)+"</td><td>"+cell(dss)+"</td></tr>"
    + "<tr><td>"+cell(dsd)+"</td></tr>"
    + "<tr><td class='damline' rowspan='2'>"+cell(dd)+"</td><td>"+cell(dds)+"</td></tr>"
    + "<tr><td>"+cell(ddd)+"</td></tr></table>"
    + "<div class='sub'>3代血統表。記録がある範囲で表示します（種牡馬ロスターは父のみ記録のため、父系の母方は「―」になります）。代を重ねるほど自家生産の牝系が埋まっていきます。</div>";

  $("#skipYearMinus").onclick = () => bumpYear(-1);
  $("#skipBtn").onclick = () => {
    const y = parseInt($("#skipYear").value,10), m = parseInt(sm.value,10), w = parseInt($("#skipWeek").value,10);
    if(!y || y < S.year || (y===S.year && (m < S.month || (m===S.month && w <= S.week)))){ alert("今より先の週を指定してください"); return; }
    skipTo(y, m, w);
  };
  // かんたんスキップ：相対チップ（今の週を起点にnヶ月先へ）と節目ジャンプ。
  // 既存の年・月・週の入力はそのまま残し、こちらは入力なしで進められる。
  document.querySelectorAll("[data-rel-months]").forEach(btn => btn.onclick = () => {
    const n = parseInt(btn.getAttribute("data-rel-months"),10);
    const total = (S.year-2026)*12 + (S.month-1) + n;
    skipTo(2026 + Math.floor(total/12), (total % 12) + 1, S.week);
  });
  const MILESTONES = { foal:[1,1], breed:[2,1], yearend:[12,4] }; // [月, 週]（出産=1月、繁殖=2月、年末=12月第4週）
  document.querySelectorAll("[data-milestone]").forEach(btn => btn.onclick = () => {
    const [m, w] = MILESTONES[btn.getAttribute("data-milestone")];
    for(let y=S.year; y<=S.year+1; y++){
      const target = (y-2026)*48 + (m-1)*4 + (w-1);
      if(target > absWeek()){ skipTo(y, m, w); return; }
    }
  });
})();
$("#resetBtn").onclick = () => { if(confirm("最初からやり直しますか？")){ localStorage.removeItem(SAVE_KEY); initState(); render(); } };
$("#exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify(S)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "keiba_save_" + S.year + "y" + S.month + "m" + S.week + "w.json";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  topic("💾 セーブをファイルに書き出しました");
};
$("#importBtn").onclick = () => { const f = $("#importFile"); if(f) f.click(); };
$("#importFile").onchange = (ev) => {
  const file = ev.target.files && ev.target.files[0];
  if(!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const data = JSON.parse(rd.result);
      if(!data || !Array.isArray(data.horses) || typeof data.year !== "number" || !Array.isArray(data.stallions)) throw new Error("bad save");
      if(!confirm("このセーブを読み込みますか？（今のデータは置き換わります）")) return;
      S = data; migrateV029(); ensureParams(); save(); render();
      topic("📥 セーブを読み込みました");
    } catch(e){ alert("読み込めませんでした（セーブファイルの形式が違うようです）"); }
  };
  rd.readAsText(file);
  ev.target.value = "";
};
$("#horseModal").onclick = e => { if(e.target.id==="horseModal") e.target.style.display="none"; };
if(!load()) initState();
ensureParams();
render();
</script>
